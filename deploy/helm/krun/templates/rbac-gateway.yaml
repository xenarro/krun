{{- if eq .Values.db.mode "postgres" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krun-gateway
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
rules:
  - apiGroups: [krun.io]
    resources: [functions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: krun-gateway
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: krun-gateway
subjects:
  - kind: ServiceAccount
    name: krun-gateway
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
