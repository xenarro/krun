{{- if .Values.gatewayApi.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "krun.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.gatewayApi.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "krun.publicServiceName" . | quote }}
          port: 8080
{{- end }}
