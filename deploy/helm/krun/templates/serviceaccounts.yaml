{{- $root := . -}}
{{- range $name := list "gateway" "scheduler" }}
{{- if or (eq $name "scheduler") (eq $root.Values.db.mode "postgres") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krun-{{ $name }}
  namespace: {{ $root.Release.Namespace | quote }}
  labels:
    {{- include "krun.labels" $root | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
{{- end }}
