apiVersion: v1
kind: Service
metadata:
  name: {{ include "krun.publicServiceName" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "krun.gatewaySelector" . | nindent 4 }}
  ports:
    - name: public
      protocol: TCP
      port: 8080
      targetPort: 8080
