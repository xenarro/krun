apiVersion: v1
kind: Service
metadata:
  name: krun-gateway-internal
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "krun.gatewaySelector" . | nindent 4 }}
  ports:
    - name: internal
      protocol: TCP
      port: 8081
      targetPort: 8081
