apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krun-function-author
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
rules:
  - apiGroups: [krun.io]
    resources: [functions]
    verbs: [get, list, watch, create, update, patch, delete]
