{{- if .Values.jobsNamespace.create }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: krun-jobs
  namespace: {{ .Values.jobsNamespace.name | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
spec:
  hard:
    {{- range $key, $value := .Values.jobsNamespace.quota }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
{{- end }}
