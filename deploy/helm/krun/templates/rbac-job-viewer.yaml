apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: krun-job-viewer
  namespace: {{ .Values.jobsNamespace.name | quote }}
  labels:
    {{- include "krun.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
