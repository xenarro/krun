name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_FROZEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.13.15"
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install helm-docs
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz --output "$RUNNER_TEMP/helm-docs.tar.gz"
          printf '%s  %s\n' 'a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc' "$RUNNER_TEMP/helm-docs.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/helm-docs-bin"
          tar -xzf "$RUNNER_TEMP/helm-docs.tar.gz" -C "$RUNNER_TEMP/helm-docs-bin" helm-docs
          printf '%s\n' "$RUNNER_TEMP/helm-docs-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/helm-docs-bin/helm-docs" --version
      - name: Validate workflow syntax
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --directory sdk/python --frozen
      - name: Check source, tests and unused code
        run: make check
      - name: Check generated files
        run: |
          make generate
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Build container
        run: make docker
      - name: Verify container commands and runtime identity
        run: |
          output=$(docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges krun:local gateway --help)
          test "$output" = 'Usage: krun gateway [--help]'
          output=$(docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges krun:local scheduler --help)
          test "$output" = 'Usage: krun scheduler [--help]'
          output=$(docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges krun:local validate --help)
          test "$output" = 'Usage: krun validate [--help] <path>...'
          node scripts/smoke-validate.ts krun:local
          node scripts/smoke-gateway.ts krun:local
          node scripts/smoke-scheduler.ts krun:local
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=16m --env KRUN_DB_MODE=embedded --env KRUN_DB_PATH=/tmp/krun-test-ci.db --entrypoint /nodejs/bin/node krun:local -e 'const assert = require("node:assert/strict"); const { spawnSync } = require("node:child_process"); const { DatabaseSync } = require("node:sqlite"); for (let i = 0; i < 2; i++) { const result = spawnSync(process.execPath, ["/app/bin/krun.js", "migrate"], { encoding: "utf8", timeout: 20000 }); assert.equal(result.status, 0); } const db = new DatabaseSync(process.env.KRUN_DB_PATH); try { assert.deepEqual(db.prepare("select name from kysely_migration order by name").all().map(row => row.name), ["0001_init", "0002_event_rowid"]); assert.equal(db.prepare("select count(*) as n from pragma_table_info(?)").get("runs").n, 25); } finally { db.close(); }'
          docker run --rm --read-only --network none --entrypoint /nodejs/bin/node krun:local -e 'const assert = require("node:assert/strict"); const fs = require("node:fs"); assert.equal(process.getuid(), 65532); assert.equal(process.getgid(), 65532); assert.equal(process.version, "v" + fs.readFileSync("/app/.node-version", "utf8").trim());'
      - name: Lint chart
        run: make helm-lint
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical
      - name: Scan container for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: krun:local
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: table

  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned kind and matching Kubernetes client
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version_file: .kind-version
          kubectl_version: v1.37.1
          install_only: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify disposable kind foundation and e2e scenarios
        env:
          TMPDIR: ${{ runner.temp }}
        run: make e2e
      - name: Remove owned disposable cluster and registry
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: make kind-down
