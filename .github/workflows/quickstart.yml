name: README quickstart

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/quickstart.yml
      - scripts/quickstart.sh
      - scripts/quickstart.ts
      - scripts/quickstart-config.ts
      - scripts/quickstart-process.ts
      - test/e2e/quickstart.ts
      - test/e2e/cluster.ts
      - test/e2e/lib/foundation-lease.ts
      - packages/cli/**
      - sdk/node/**
      - deploy/helm/krun/**
      - Makefile
      - README.md

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [embedded, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - name: Install pinned kind and matching Kubernetes client
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version_file: .kind-version
          kubectl_version: v1.37.1
          install_only: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Rehearse the README on a fresh owned kind cluster
        env:
          TMPDIR: ${{ runner.temp }}
          MODE: ${{ matrix.mode }}
        run: |
          make build
          timeout 1800s node test/e2e/quickstart.ts "$MODE"
      - name: Remove owned disposable cluster and registry
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: make kind-down
