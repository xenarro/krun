name: Pages

# Builds the documentation site (site/) on pull requests and deploys it to
# GitHub Pages from main. Kept apart from ci.yml, which must stay read-only.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "deploy/helm/krun/README.md"
      - "sdk/node/README.md"
      - "sdk/python/README.md"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "deploy/helm/krun/README.md"
      - "sdk/node/README.md"
      - "sdk/python/README.md"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # On main, read the deployed origin and base path, so a custom domain or a
      # user site needs no code change. Pull requests build for /krun/.
      - id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Use the Pages origin and base path
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          printf 'KRUN_SITE_ORIGIN=%s\n' "$PAGES_ORIGIN" >> "$GITHUB_ENV"
          printf 'KRUN_SITE_BASE=%s/\n' "$PAGES_BASE_PATH" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm run site:build
      - name: Check every internal link and anchor
        run: pnpm --filter @krun/site run site:links
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
