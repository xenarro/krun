name: Native benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/benchmark.yml
      - scripts/bench.ts
      - tsconfig.bench.json
      - test/e2e/lib/benchmark.ts
      - test/e2e/lib/harness.ts
      - test/e2e/functions/benchmark.sh
      - Makefile

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [embedded, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - name: Install pinned kind and matching Kubernetes client
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version_file: .kind-version
          kubectl_version: v1.37.1
          install_only: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Measure 500 real ten-second Jobs and exit1 detection
        env:
          TMPDIR: ${{ runner.temp }}
          MODE: ${{ matrix.mode }}
        run: |
          make kind-up bench-build
          node test/e2e/cluster.ts install "$MODE"
          node test/e2e/cluster.ts verify
          node dist/bench/scripts/bench.js
          node test/e2e/cluster.ts uninstall
      - name: Remove owned disposable cluster and registry
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: make kind-down
