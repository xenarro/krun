apiVersion: v1
kind: Namespace
metadata:
  name: krun
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.33
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.33
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: krun-scheduler, namespace: krun}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: krun-scheduler, namespace: krun}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [krun-scheduler]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [krun.io]
    resources: [functions]
    verbs: [get, list, watch]
  - apiGroups: [krun.io]
    resources: [functions/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: krun-scheduler, namespace: krun}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: krun-scheduler}
subjects: [{kind: ServiceAccount, name: krun-scheduler, namespace: krun}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: krun-function-author, namespace: krun}
rules:
  - apiGroups: [krun.io]
    resources: [functions]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: krun-deny-ingress, namespace: krun}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: krun, app.kubernetes.io/instance: e2e}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: krun-allow-public, namespace: krun}
spec:
  podSelector:
    matchLabels: {krun.io/gateway: "true"}
  policyTypes: [Ingress]
  ingress: [{ports: [{protocol: TCP, port: 8080}]}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: krun-allow-internal, namespace: krun}
spec:
  podSelector:
    matchLabels: {krun.io/gateway: "true"}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: krun-jobs}
      ports: [{protocol: TCP, port: 8081}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: krun-allow-admin, namespace: krun}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: krun, app.kubernetes.io/instance: e2e}
  policyTypes: [Ingress]
  ingress: [{ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 9091}]}]
---
apiVersion: v1
kind: Service
metadata: {name: krun-gateway, namespace: krun}
spec:
  selector: {app.kubernetes.io/name: krun, app.kubernetes.io/instance: e2e}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: krun-gateway-internal, namespace: krun}
spec:
  selector: {app.kubernetes.io/name: krun, app.kubernetes.io/instance: e2e}
  ports: [{name: internal, port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: krun, namespace: krun}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: krun, app.kubernetes.io/instance: e2e}
  template:
    metadata:
      labels: {app.kubernetes.io/name: krun, app.kubernetes.io/instance: e2e, krun.io/gateway: "true"}
    spec:
      serviceAccountName: krun-scheduler
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate
          image: __KRUN_E2E_IMAGE__
          args: [migrate]
          env:
            - {name: KRUN_DB_MODE, value: embedded}
            - {name: KRUN_DB_PATH, value: /data/krun.db}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}]
      containers:
        - name: gateway
          image: __KRUN_E2E_IMAGE__
          args: [gateway]
          env:
            - {name: KRUN_DB_MODE, value: embedded}
            - {name: KRUN_DB_PATH, value: /data/krun.db}
            - {name: KRUN_NAMESPACE, value: krun}
            - {name: KRUN_WEBHOOK_ALLOWED_HOSTS, value: "krun-test-webhook-*.krun.svc.cluster.local"}
            - {name: KRUN_WEBHOOK_ALLOWED_CIDRS, value: "10.244.0.0/16,10.96.0.0/16"}
            - {name: KRUN_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: krun-e2e-webhook-keys, key: secrets}}}
            - {name: KRUN_S3_ENDPOINT, value: "http://krun-test-minio.krun-test-minio.svc.cluster.local:9000"}
            - {name: KRUN_S3_BUCKET, value: krun-test-results}
            - {name: KRUN_S3_REGION, value: us-east-1}
            - {name: KRUN_S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: krun-test-minio-credentials, key: accessKey}}}
            - {name: KRUN_S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: krun-test-minio-credentials, key: secretKey}}}
            - {name: KRUN_API_KEYS_PATH, value: /etc/krun/keys.yaml}
          ports: [{name: public, containerPort: 8080}, {name: internal, containerPort: 8081}, {name: admin, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /readyz, port: 9090}, periodSeconds: 1, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 9090}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}, {name: keys, mountPath: /etc/krun, readOnly: true}]
        - name: scheduler
          image: __KRUN_E2E_IMAGE__
          args: [scheduler]
          env:
            - {name: KRUN_DB_MODE, value: embedded}
            - {name: KRUN_DB_PATH, value: /data/krun.db}
            - {name: KRUN_NAMESPACE, value: krun}
            - {name: KRUN_WEBHOOK_ALLOWED_HOSTS, value: "krun-test-webhook-*.krun.svc.cluster.local"}
            - {name: KRUN_WEBHOOK_ALLOWED_CIDRS, value: "10.244.0.0/16,10.96.0.0/16"}
            - {name: KRUN_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: krun-e2e-webhook-keys, key: secrets}}}
            - {name: KRUN_S3_ENDPOINT, value: "http://krun-test-minio.krun-test-minio.svc.cluster.local:9000"}
            - {name: KRUN_S3_BUCKET, value: krun-test-results}
            - {name: KRUN_S3_REGION, value: us-east-1}
            - {name: KRUN_S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: krun-test-minio-credentials, key: accessKey}}}
            - {name: KRUN_S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: krun-test-minio-credentials, key: secretKey}}}
            - {name: KRUN_JOBS_NAMESPACE, value: krun-jobs}
            - {name: KRUN_ADMIN_LISTEN_ADDR, value: ":9091"}
            - {name: KRUN_GATEWAY_INTERNAL_URL, value: "http://krun-gateway-internal.krun.svc:8081"}
            - {name: KRUN_POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          ports: [{name: admin-sched, containerPort: 9091}]
          readinessProbe: {httpGet: {path: /readyz, port: 9091}, periodSeconds: 1, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: 9091}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /data}, {name: tmp, mountPath: /tmp}]
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: keys
          secret: {secretName: krun-e2e-keys, defaultMode: 288}
