apiVersion: v1
kind: Namespace
metadata:
  name: krun-jobs
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.33
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.33
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.33
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: krun-jobs-deny-all, namespace: krun-jobs}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: krun-jobs-allow-dns, namespace: krun-jobs}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: krun-jobs-allow-gateway, namespace: krun-jobs}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: krun}
          podSelector:
            matchLabels: {krun.io/gateway: "true"}
      ports: [{protocol: TCP, port: 8081}]
---
apiVersion: v1
kind: LimitRange
metadata: {name: krun-jobs, namespace: krun-jobs}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi}
      default: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
      max: {cpu: "4", memory: 8Gi, ephemeral-storage: 20Gi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: krun-jobs, namespace: krun-jobs}
spec:
  hard: {pods: "200", requests.cpu: "50", requests.memory: 100Gi, requests.ephemeral-storage: 100Gi}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: krun-job-default, namespace: krun-jobs}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: krun-scheduler, namespace: krun-jobs}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: krun-scheduler, namespace: krun-jobs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: krun-scheduler}
subjects: [{kind: ServiceAccount, name: krun-scheduler, namespace: krun}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: krun-job-viewer, namespace: krun-jobs}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
