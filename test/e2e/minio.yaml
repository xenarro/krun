apiVersion: v1
kind: Namespace
metadata:
  name: krun-test-minio
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.33
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krun-test-minio
  namespace: krun-test-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krun-test-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krun-test-minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: __KRUN_E2E_MINIO_IMAGE__
          args: [--quiet, server, /data, --address, ':9000']
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: krun-test-minio-credentials
                  key: accessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: krun-test-minio-credentials
                  key: secretKey
            - name: MINIO_BROWSER
              value: 'off'
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: '1', memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: krun-test-minio
  namespace: krun-test-minio
spec:
  selector:
    app.kubernetes.io/name: krun-test-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: krun-test-minio-isolation
  namespace: krun-test-minio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: krun-test-minio
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: krun
          podSelector:
            matchLabels:
              app.kubernetes.io/name: krun
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: krun-jobs
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: krun-test-minio-init
      ports:
        - protocol: TCP
          port: 9000
