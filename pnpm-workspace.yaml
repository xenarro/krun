packages:
  - packages/*
  - apps/*

autoInstallPeers: false

# Testcontainers' SSH accelerators are optional; protobufjs only warns about
# version notation. Keep all three install scripts disabled explicitly.
allowBuilds:
  cpu-features: false
  ssh2: false
  protobufjs: false

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - effect@4.0.6
  - '@effect/platform-node@4.0.6'
  - '@effect/platform-node-shared@4.0.6'
  - '@effect/vitest@4.0.6'

patchedDependencies:
  thread-stream@4.2.0: patches/thread-stream@4.2.0.patch

